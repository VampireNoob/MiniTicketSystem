<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Neues Ticket erstellen</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body>
    <div class="page-header">
        <div>
            <h1>Neues Ticket erstellen</h1>
            <a th:href="@{/}">← Zurück zur Übersicht</a>
        </div>
        <button id="theme-toggle">Dark Mode</button>
    </div>

    <form class="ticket-form" th:action="@{/tickets/new}" method="post">
        <label>
            Titel
            <input type="text" name="title" required>
        </label>

        <label>
            Beschreibung
            <textarea name="description" rows="4"></textarea>
        </label>

        <label>
            Zuständig für (optional)
            <input type="text" name="assignee" placeholder="z. B. Max Mustermann">
        </label>

        <label>
            Priorität
            <select name="priority">
                <option value="NIEDRIG">Niedrig</option>
                <option value="MITTEL">Mittel</option>
                <option value="HOCH">Hoch</option>
            </select>
        </label>

        <button type="submit" class="btn-primary">Ticket erstellen</button>
    </form>

    <script th:src="@{/js/theme.js}"></script>
</body>
</html>
