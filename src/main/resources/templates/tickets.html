<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mini-Ticketsystem</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body>
    <div class="page-header">
        <div>
            <h1>Alle Tickets</h1>
            <a th:href="@{/tickets/new}">+ Neues Ticket erstellen</a>
        </div>
        <button id="theme-toggle">Dark Mode</button>
    </div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Titel</th>
            <th>Priorität</th>
            <th>Status</th>
            <th>Aktionen</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="ticket : ${tickets}" th:class="${'status-' + #strings.toLowerCase(ticket.status)} + ' ' + ${'priority-' + #strings.toLowerCase(ticket.priority)}">
            <td data-label="ID" th:text="${ticket.id}">1</td>
            <td data-label="Titel" th:text="${ticket.title}">Titel</td>
            <td data-label="Priorität"><span class="priority-badge" th:text="${ticket.priority}">HOCH</span></td>
            <td data-label="Status"><span class="status-badge" th:text="${ticket.status}">OFFEN</span></td>
            <td data-label="Aktionen">
                <form th:if="${ticket.status.name() != 'ERLEDIGT'}"
                        th:action="@{/tickets/{id}/advance(id=${ticket.id})}"
                        method="post">
                    <button type="submit">Nächster Status</button>
                </form>
                <form th:action="@{/tickets/{id}/delete(id=${ticket.id})}"
                        method="post"
                        onsubmit="return confirm('Ticket wirklich löschen?');">
                    <button type="submit">Löschen</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
    <script th:src="@{/js/theme.js}"></script>
</body>
</html>
